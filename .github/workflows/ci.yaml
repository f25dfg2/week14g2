name: ci-wf
on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize
jobs:
  lint-job:
    runs-on: ubuntu-latest
    steps:
      - name: Welcome Step
        run: echo "Welcome TO the Linting Job"
      - name: Clone Repo
        uses: actions/checkout@v6
      - name: Install Development Dependencies
        run: npm install
      - name: Lint HTML and CSS Files
        run: |
          npx htmlhint "**/*.html"
          npx stylelint "**/*.css"
  build-website-job:
    runs-on: ubuntu-latest
    needs: "lint-job"
    steps:
      - name: Weclome to Build Job
        run: echo "Weclome to Build Job"
      - name: Clone Repo
        uses: actions/checkout@v6
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: build website image 
        run: docker image build -t ${{secrets.DOCKERHUB_USERNAME}}/w14g2:latest .
      - name: push image on ducker hub 
        run: docker push ${{secrets.DOCKERHUB_USERNAME}}/w14g2:latest .  

      - name: Install Dev-Dep
        run: npm install
      - name: Build Website with Parcel
        run: npx parcel build "./src/index.html" --dist-dir "./dist" --public-url "./" --no-cache
  build-image-job:
    runs-on: ubuntu-latest
    needs: "build-website-job"
    steps:
      - name: Welcome To the Image Building Job
        run: echo "Image Building Job Starting"
      - name: Clone The Repo
        uses: actions/checkout@v6
      - name: Build Website Image
        run: docker image build -t static-website:latest .
      - name: List the Available Images on Runner
        run: docker image ls
      - name: Create and Run Container from New Image
        run: docker container run -d -p 2222:80 static-website:latest
      - name: List The Running COntainers
        run: docker container ls
        
      # - name: Stop The Running Containers
      #   run: docker container stop $(docker container ls)
      # - name: Kill all the unsed resoruces at Runner
      #   run: docker system prune -a --volumes